<script>
// ==========================================
// 1. ИНИЦИАЛИЗАЦИЯ ПОДКЛЮЧЕНИЯ К SUPABASE
// ==========================================
let SUPABASE_URL = localStorage.getItem('lfk_supabase_url') || 'https://mbipbmjlumovyymxeezr.supabase.co';
let SUPABASE_ANON_KEY = localStorage.getItem('lfk_supabase_key') || 'sb_publishable_J6-bMxiDV6gofFS2tockHA_fQWpWkni';
let supabase = null;

if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
  try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    console.error('Ошибка инициализации Supabase:', e);
  }
}

// Локальный кэш данных приложения
let db = {
  users: [],
  exercises: [],
  prescriptions: {},
  history: [],
  payments: [],
  slots: [],
  slotSettings: { fromHour: 8, toHour: 20, capPerHour: 4, daysCount: 7 }
};

let state = {
  currentUser: null,
  authStep: 'email',
  authEmail: '',
  authGeneratedCode: '',
  authCodeInput: '',
  authNameInput: '',
  authIsNewUser: false,
  isLoading: false,

  activeTab: 'home',
  doctorPatientsFilter: 'mine',

  subScreen: null,
  selectedPatientId: null,
  selectedExerciseId: null,

  modal: null,

  tempPrescriptions: [],
  exerciseFormDraft: { id: null, title: '', description: '', photo: '', video: '' },
  workoutState: {
    index: 0,
    sets: 1,
    reps: 10,
    weight: '',

    comment: '',
    showExample: false

};

// ==========================================
// 2. СИНХРОНИЗАЦИЯ С ОБЛАКОМ (FETCH И REALTIME)
// ==========================================
async function fetchCloudData() {
  if (!supabase) return;
  state.isLoading = true;
  render();

  try {
    const [profilesRes, exercisesRes, prescRes, historyRes, paymentsRes, slotsRes] = await Promise.all([
      supabase.from('profiles').select('*'),
      supabase.from('exercises').select('*').order('created_at', { ascending: true }),
      supabase.from('prescriptions').select('*').order('sort_order', { ascending: true }),
      supabase.from('workout_history').select('*').order('created_at', { ascending: false }),
      supabase.from('payments').select('*').order('created_at', { ascending: false }),
      supabase.from('schedule_slots').select('*').order('day_index', { ascending: true })
    ]);

    if (profilesRes.data) db.users = profilesRes.data;
    if (exercisesRes.data) {
      db.exercises = exercisesRes.data.map(e => ({
        id: e.id,
        title: e.title,
        description: e.description,
        photo: e.photo_url,
        video: e.video_url
      }));
    }

    db.prescriptions = {};
    if (prescRes.data) {
      prescRes.data.forEach(p => {
        if (!db.prescriptions[p.patient_id]) db.prescriptions[p.patient_id] = [];
        db.prescriptions[p.patient_id].push({
          id: p.id,
          exerciseId: p.exercise_id,
          sets: p.sets,
          reps: p.reps,
          note: p.note
        });
      });
    }

    if (historyRes.data) {
      db.history = historyRes.data.map(h => ({
        id: h.id,
        patientId: h.patient_id,
        exerciseId: h.exercise_id,
        exerciseTitle: h.exercise_title,
        date: h.date_label,
        dateLabel: h.date_label,
        sets: h.sets,
        reps: h.reps,
        weight: h.weight,
        feeling: h.feeling,
        comment: h.comment,
        status: h.status
      }));
    }

    if (paymentsRes.data) {
      db.payments = paymentsRes.data.map(p => ({
        id: p.id,
        patientId: p.patient_id,
        lessons: p.lessons,
        amount: p.amount,
        date: p.payment_date,
        note: p.note
      }));
    }

    // Группировка слотов расписания по дням
    if (slotsRes.data && slotsRes.data.length > 0) {
      const grouped = {};
      slotsRes.data.forEach(s => {
        if (!grouped[s.day_index]) {
          grouped[s.day_index] = { dayIndex: s.day_index, dayLabel: s.day_label, hours: [] };
        }
        grouped[s.day_index].hours.push({
          id: s.id,
          time: s.slot_time,
          capacity: s.capacity,
          bookedPatientIds: s.booked_patient_ids || []
        });
      });
      db.slots = Object.values(grouped).sort((a,b) => a.dayIndex - b.dayIndex);
    }

    // Обновляем текущего пользователя, если он уже вошёл в систему
    if (state.currentUser) {
      const updated = db.users.find(u => u.id === state.currentUser.id);
      if (updated) state.currentUser = updated;
    }
  } catch (err) {
    console.error('Ошибка загрузки данных из облака:', err);
  } finally {
    state.isLoading = false;
    render();
  }
}

function initRealtimeSubscription() {
  if (!supabase) return;
  supabase
    .channel('lfk_realtime_changes')
    .on('postgres_changes', { event: '*', schema: 'public' }, () => {
      fetchCloudData();
    })
    .subscribe();
}

function saveSupabaseConfig() {
  const urlEl = document.getElementById('config-sb-url');
  const keyEl = document.getElementById('config-sb-key');
  const url = urlEl ? urlEl.value.trim() : '';
  const key = keyEl ? keyEl.value.trim() : '';

  if (!url || !key) {
    alert('Пожалуйста, укажите URL и Anon Key проекта Supabase');
    return;
  }

  localStorage.setItem('lfk_supabase_url', url);
  localStorage.setItem('lfk_supabase_key', key);
  SUPABASE_URL = url;
  SUPABASE_ANON_KEY = key;
  supabase = window.supabase.createClient(url, key);

  state.modal = null;
  fetchCloudData();
  initRealtimeSubscription();
}

// ==========================================
// 3. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ И ИКОНКИ
// ==========================================
function getDoctorById(id) {
  return db.users.find(u => u.id === id && u.role === 'doctor');
}
function getPatientById(id) {
  return db.users.find(u => u.id === id && u.role === 'patient');
}
function getExerciseById(id) {
  return db.exercises.find(e => e.id === id);
}

// ==========================================
// 4. ЛОГИКА АВТОРИЗАЦИИ
// ==========================================
function requestCode() {
  const email = state.authEmail.trim().toLowerCase();
  if (!email || !email.includes('@')) {
    alert('Пожалуйста, введите корректный E-mail');
    return;
  }
  const existing = db.users.find(u => u.email.toLowerCase() === email);
  state.authIsNewUser = !existing;
  state.authGeneratedCode = String(Math.floor(100000 + Math.random() * 900000));
  state.authCodeInput = state.authGeneratedCode;
  state.authNameInput = '';
  state.authStep = 'code';
  render();
}

async function verifyCodeAndLogin() {
  if (state.authCodeInput.trim() !== state.authGeneratedCode) {
    alert('Неверный код из письма');
    return;
  }
  const email = state.authEmail.trim().toLowerCase();
  let user = db.users.find(u => u.email.toLowerCase() === email);

  if (!user && supabase) {
    const name = state.authNameInput.trim() || email.split('@')[0];
    const { data, error } = await supabase.from('profiles').insert([{
      email,
      role: 'patient',
      name,
      phone: '',
      balance: 0
    }]).select().single();

    if (error) {
      alert('Ошибка регистрации в базе: ' + error.message);
      return;
    }
    user = data;
    db.users.push(user);
  } else if (user && user.role === 'doctor' && supabase) {
    await supabase.from('profiles').update({ logged_in: true }).eq('id', user.id);
    user.logged_in = true;
  }

  loginAsUser(user);
}

function loginAsUser(user) {
  state.currentUser = user;
  state.subScreen = null;
  state.modal = null;
  if (user.role === 'admin') state.activeTab = 'home';
  else if (user.role === 'doctor') state.activeTab = 'patients';
  else state.activeTab = 'home';
  render();
}

function quickLogin(email) {
  const user = db.users.find(u => u.email.toLowerCase() === email.toLowerCase());
  if (user) loginAsUser(user);
  else alert('Пользователь не найден в базе данных Supabase');
}

// ==========================================
// 5. ДЕЙСТВИЯ АДМИНИСТРАТОРА (ВЫЗОВЫ SUPABASE)
// ==========================================
async function adminAddDoctor() {
  const emailEl = document.getElementById('modal-doc-email');
  const nameEl = document.getElementById('modal-doc-name');
  const email = emailEl ? emailEl.value.trim().toLowerCase() : '';
  const name = nameEl ? nameEl.value.trim() : '';

  if (!email || !email.includes('@')) {
    alert('Введите корректный E-mail врача');
    return;
  }
  if (db.users.some(u => u.email.toLowerCase() === email)) {
    alert('Пользователь с таким E-mail уже существует');
    return;
  }

  if (supabase) {
    const { data, error } = await supabase.from('profiles').insert([{
      email,
      role: 'doctor',
      name: name || email.split('@')[0],
      phone: '',
      logged_in: false
    }]).select().single();

    if (error) {
      alert('Ошибка добавления врача в Supabase: ' + error.message);
      return;
    }
    db.users.push(data);
  }
  state.modal = null;
  render();
}

async function adminDeleteDoctor(docId) {
  if (supabase) {
    await supabase.from('profiles').delete().eq('id', docId);
  }
  db.users = db.users.filter(u => u.id !== docId);
  render();
}

async function adminAddPayment() {
  const lessons = parseInt(document.getElementById('pay-lessons').value, 10) || 0;
  const amount = parseInt(document.getElementById('pay-amount').value, 10) || 0;
  const note = document.getElementById('pay-note').value.trim();

  if (lessons <= 0) {
    alert('Укажите количество занятий');
    return;
  }
  const pat = getPatientById(state.selectedPatientId);
  if (!pat) return;

  const newBalance = (pat.balance || 0) + lessons;

  if (supabase) {
    const { data, error } = await supabase.from('payments').insert([{
      patient_id: pat.id,
      lessons,
      amount,
      note,
      payment_date: new Date().toISOString().split('T')[0]
    }]).select().single();

    await supabase.from('profiles').update({ balance: newBalance }).eq('id', pat.id);

    if (data) db.payments.unshift(data);
  }
  pat.balance = newBalance;
  state.modal = null;
  render();
}

async function generateScheduleSlots() {
  const fromHour = parseInt(document.getElementById('slot-from')?.value ?? 8, 10);
  const toHour = parseInt(document.getElementById('slot-to')?.value ?? 20, 10);
  const cap = parseInt(document.getElementById('slot-cap')?.value ?? 10, 10);
  const days = parseInt(document.getElementById('slot-days')?.value ?? 7, 10);

  const baseDate = new Date();
  const monthsGen = ['ЯНВАРЯ','ФЕВРАЛЯ','МАРТА','АПРЕЛЯ','МАЯ','ИЮНЯ','ИЮЛЯ','АВГУСТА','СЕНТЯБРЯ','ОКТЯБРЯ','НОЯБРЯ','ДЕКАБРЯ'];
  const insertPayload = [];

  for (let d = 0; d < days; d++) {
    const dt = new Date(baseDate);
    dt.setDate(baseDate.getDate() + d);
    let dayLabel = `${dt.getDate()} ${monthsGen[dt.getMonth()]}`;
    if (d === 0) dayLabel = 'СЕГОДНЯ';
    else if (d === 1) dayLabel = 'ЗАВТРА';

    for (let h = fromHour; h < toHour; h++) {
      const timeStr = String(h).padStart(2, '0') + ':00';
      insertPayload.push({
        day_index: d,
        day_label: dayLabel,
        slot_time: timeStr,
        capacity: cap,
        booked_patient_ids: []
      });
    }
  }

  if (supabase) {
    await supabase.from('schedule_slots').delete().neq('day_index', -1);
    await supabase.from('schedule_slots').insert(insertPayload);
    await fetchCloudData();
  }
  state.activeTab = 'schedule';
  render();
}

// ==========================================
async function doctorTakePatient(patId) {
  const pat = getPatientById(patId);
  if (pat && state.currentUser) {
    if (supabase) {
      await supabase.from('profiles').update({ doctor_id: state.currentUser.id }).eq('id', pat.id);
    }
    pat.doctor_id = state.currentUser.id;
    state.doctorPatientsFilter = 'mine';
    render();
  }
}

function openEditPrescriptions(patId) {
  const current = db.prescriptions[patId] || [];
  state.tempPrescriptions = JSON.parse(JSON.stringify(current));
  state.subScreen = 'editPrescriptions';
  render();
}

function syncPrescriptionInputsFromDOM() {
  state.tempPrescriptions.forEach((item, idx) => {
    const sEl = document.getElementById(`presc-sets-${idx}`);
    const rEl = document.getElementById(`presc-reps-${idx}`);
    const nEl = document.getElementById(`presc-note-${idx}`);
    if (sEl) item.sets = parseInt(sEl.value, 10) || 1;
    if (rEl) item.reps = parseInt(rEl.value, 10) || 10;
    if (nEl) item.note = nEl.value;
  });
}

function movePrescription(idx, dir) {
  syncPrescriptionInputsFromDOM();
  const target = idx + dir;
  if (target < 0 || target >= state.tempPrescriptions.length) return;
  const tmp = state.tempPrescriptions[idx];
  state.tempPrescriptions[idx] = state.tempPrescriptions[target];
  state.tempPrescriptions[target] = tmp;
  render();
}

function removePrescriptionItem(idx) {
  syncPrescriptionInputsFromDOM();
  state.tempPrescriptions.splice(idx, 1);
  render();
}

function addPrescriptionExercise(exId) {
  syncPrescriptionInputsFromDOM();
  state.tempPrescriptions.push({ exerciseId: exId, sets: 1, reps: 12, note: '' });
  render();
}

async function savePrescriptions() {
  syncPrescriptionInputsFromDOM();
  const patId = state.selectedPatientId;

  if (supabase) {
    await supabase.from('prescriptions').delete().eq('patient_id', patId);
    const payload = state.tempPrescriptions.map((p, idx) => ({
      patient_id: patId,
      exercise_id: p.exerciseId,
      sets: p.sets,
      reps: p.reps,
      note: p.note,
      sort_order: idx
    }));
    if (payload.length > 0) {
      await supabase.from('prescriptions').insert(payload);
    }
    await fetchCloudData();
  }
  state.subScreen = 'patientDetail';
  render();
}

function openExerciseForm(exId = null) {
  if (exId) {
    const ex = getExerciseById(exId);
    state.exerciseFormDraft = { ...ex };
  } else {
    state.exerciseFormDraft = { id: null, title: '', description: '', photo: '', video: '' };
  }
  state.subScreen = 'exerciseForm';
  render();
}

async function handleFileUpload(inputEl, type) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;

  const titleEl = document.getElementById('ex-form-title');
  const descEl = document.getElementById('ex-form-desc');
  if (titleEl) state.exerciseFormDraft.title = titleEl.value;
  if (descEl) state.exerciseFormDraft.description = descEl.value;

  if (!supabase) {
    // Режим оффлайн fallback (DataURL)
    const reader = new FileReader();
    reader.onload = (e) => {
      if (type === 'photo') state.exerciseFormDraft.photo = e.target.result;
      if (type === 'video') state.exerciseFormDraft.video = e.target.result;
      render();
    };
    reader.readAsDataURL(file);
    return;
  }

  // Загрузка в Supabase Storage (корзина exercise-media)
  try {
    const ext = file.name.split('.').pop();
    const filePath = `${type}s/${Date.now()}_${Math.random().toString(36).substring(2,7)}.${ext}`;
    const { error: uploadError } = await supabase.storage.from('exercise-media').upload(filePath, file);

    if (uploadError) {
      alert('Ошибка загрузки файла в хранилище Supabase: ' + uploadError.message);
      return;
    }
    const { data: urlData } = supabase.storage.from('exercise-media').getPublicUrl(filePath);
    if (type === 'photo') state.exerciseFormDraft.photo = urlData.publicUrl;
    if (type === 'video') state.exerciseFormDraft.video = urlData.publicUrl;
    render();
  } catch (err) {
    alert('Исключение при передаче файла: ' + err.message);
  }
}

async function saveExerciseForm() {
  const title = document.getElementById('ex-form-title').value.trim();
  const description = document.getElementById('ex-form-desc').value.trim();
  if (!title) {
    alert('Введите название упражнения');
    return;
  }

  const payload = {
    title,
    description,
    photo_url: state.exerciseFormDraft.photo || '',
    video_url: state.exerciseFormDraft.video || ''
  };

  if (supabase) {
    if (state.exerciseFormDraft.id) {
      await supabase.from('exercises').update(payload).eq('id', state.exerciseFormDraft.id);
      state.subScreen = 'exerciseDetail';
    } else {
      await supabase.from('exercises').insert([payload]);
      state.subScreen = null;
    }
    await fetchCloudData();
  }
  render();
}

async function deleteExercise(exId) {
  if (supabase) {
    await supabase.from('exercises').delete().eq('id', exId);

  }
  state.subScreen = null;
  render();
}

function startWorkoutSession() {
  const patId = state.currentUser.id;
  const list = db.prescriptions[patId] || [];
  if (list.length === 0) {
    alert('Вам ещё не назначены упражнения');
    return;
  }
  const first = list[0];
  state.workoutState = {
    index: 0,
    sets: first.sets,
    reps: first.reps,
    weight: '',
    feeling: 'Норм',
    comment: '',
    showExample: false
  };
  state.subScreen = 'workoutSession';
  render();
}

function syncWorkoutInputs() {
  const sEl = document.getElementById('wo-sets');
  const rEl = document.getElementById('wo-reps');
  const wEl = document.getElementById('wo-weight');
  const cEl = document.getElementById('wo-comment');
  if (sEl) state.workoutState.sets = parseInt(sEl.value, 10) || 1;
  if (rEl) state.workoutState.reps = parseInt(rEl.value, 10) || 10;
  if (wEl) state.workoutState.weight = wEl.value.trim();
  if (cEl) state.workoutState.comment = cEl.value;
}

async function recordWorkoutStep(status) {
  syncWorkoutInputs();
  const patId = state.currentUser.id;
  const list = db.prescriptions[patId] || [];
  const currentItem = list[state.workoutState.index];
  const ex = getExerciseById(currentItem.exerciseId);

  const report = {
    patient_id: patId,
    exercise_id: currentItem.exerciseId,
    exercise_title: ex ? ex.title : 'Упражнение',
    date_label: 'СЕГОДНЯ',
    sets: state.workoutState.sets,
    reps: state.workoutState.reps,
    weight: state.workoutState.weight,
    feeling: state.workoutState.feeling,
    comment: status === 'skipped' ? 'Не выполнено' : state.workoutState.comment,
    status
  };

  if (supabase) {
    await supabase.from('workout_history').insert([report]);
    await fetchCloudData();
  }

  const nextIdx = state.workoutState.index + 1;
  if (nextIdx < list.length) {
    const nextItem = list[nextIdx];
    state.workoutState = {
      index: nextIdx,
      sets: nextItem.sets,
      reps: nextItem.reps,
      weight: '',
      feeling: 'Норм',
      comment: '',
      showExample: false
    };
    state.modal = null;
    render();
  } else {
    state.modal = 'workoutFinished';
    render();
  }
}

async function patientBookSlot(dayLabel, timeStr) {
  const pat = state.currentUser;
  if ((pat.balance || 0) <= 0) {
    alert('У вас нет оплаченных занятий. Обратитесь к Администратору.');
    return;
  }
  const bookedStr = `${dayLabel}, ${timeStr}`;
  const newBalance = Math.max(0, (pat.balance || 0) - 1);

  if (supabase) {
    await supabase.from('profiles').update({
      booked_slot: bookedStr,
      balance: newBalance
    }).eq('id', pat.id);
    await fetchCloudData();
  }
  state.modal = null;
  render();
}

async function saveProfileChanges() {
  const nameEl = document.getElementById('prof-name');
  const phoneEl = document.getElementById('prof-phone');
  const name = nameEl ? nameEl.value.trim() : '';
  const phone = phoneEl ? phoneEl.value.trim() : '';

  if (supabase) {
    await supabase.from('profiles').update({ name, phone }).eq('id', state.currentUser.id);
  }
  state.currentUser.name = name;
  state.currentUser.phone = phone;
  alert('Профиль сохранён в Supabase');
  render();
}

function render() {
  const container = document.getElementById('app-container');

  if (!state.currentUser) {
    container.innerHTML = renderAuthScreen() + renderModal();
    return;
  }

  let contentHtml = '';
  const role = state.currentUser.role;

  if (state.subScreen === 'patientDetail') contentHtml = renderPatientDetailScreen();
  else if (state.subScreen === 'patientHistory') contentHtml = renderPatientHistoryScreen();
  else if (state.subScreen === 'editPrescriptions') contentHtml = renderEditPrescriptionsScreen();
  else if (state.subScreen === 'exerciseDetail') contentHtml = renderExerciseDetailScreen();
  else if (state.subScreen === 'exerciseForm') contentHtml = renderExerciseFormScreen();
  else if (state.subScreen === 'workoutSession') contentHtml = renderWorkoutSessionScreen();
  else {
    if (role === 'admin') contentHtml = renderAdminTabs();
    else if (role === 'doctor') contentHtml = renderDoctorTabs();
    else contentHtml = renderPatientTabs();
  }

  const navHtml = state.subScreen === 'workoutSession' ? '' : renderBottomNav(role);
  const modalHtml = renderModal();

  container.innerHTML = contentHtml + navHtml + modalHtml;
}

  return `
    <div class="p-4 pt-5 space-y-4">
      <button onclick="state.subScreen=null; render();" class="text-sm brand-purple-text font-medium flex items-center gap-1">
        <span>‹</span> <span>Назад</span>
      </button>

      <div>
        <h1 class="text-2xl font-bold">Тренировка</h1>
        <p class="text-xs text-gray-500">${ws.index + 1} из ${list.length}</p>
        <div class="w-full h-1.5 bg-gray-200 rounded-full mt-2 overflow-hidden">
          <div class="h-full brand-purple transition-all" style="width: ${progressPct}%"></div>
        </div>
      </div>

      <div class="card p-4 space-y-3">
        <div class="text-xs text-gray-400">Упражнение ${ws.index + 1} / ${list.length}</div>
        <div class="font-bold text-lg">${ex ? ex.title : ''}</div>
        <div class="text-xs text-gray-500">${ex ? ex.description : ''}</div>

        ${currentItem.note ? `
          <div class="bg-[#fffbeb] rounded-xl p-3 text-xs">
            <div class="font-semibold text-[#d97706]">Заметка от Врача:</div>
            <div class="text-gray-800 mt-0.5">${currentItem.note}</div>
          </div>
        ` : ''}

        <div class="font-bold text-sm">Цель: ${currentItem.sets} × ${currentItem.reps}</div>

        ${(ex && (ex.photo || ex.video)) ? `
          <button onclick="syncWorkoutInputs(); state.workoutState.showExample = !state.workoutState.showExample; render();" class="w-full border border-gray-200 rounded-xl py-2.5 text-xs font-semibold flex items-center justify-center gap-1.5">
            <span>▶</span> <span>${ws.showExample ? 'Скрыть пример' : 'Показать пример'}</span>
          </button>
          ${ws.showExample ? `
            <div class="space-y-2 pt-1">
              ${ex.photo ? `<img src="${ex.photo}" class="w-full h-40 object-cover rounded-xl">` : ''}
              ${ex.video ? `<video src="${ex.video}" controls class="w-full h-40 rounded-xl bg-black"></video>` : ''}
            </div>
          ` : ''}
        ` : ''}
      </div>

      <div class="card p-4 space-y-3">
        <div class="text-xs font-semibold text-gray-400 uppercase">ОТМЕТКА О ВЫПОЛНЕНИИ</div>
        <div class="grid grid-cols-3 gap-2.5">
          <div>
            <label class="text-xs text-gray-500 block mb-1">Подходов</label>
            <input id="wo-sets" type="number" value="${ws.sets}" class="input-field">
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">Раз</label>
            <input id="wo-reps" type="number" value="${ws.reps}" class="input-field">
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">Вес (кг)</label>
            <input id="wo-weight" type="text" value="${ws.weight}" class="input-field">
          </div>
        </div>

        <div>
          <div class="text-xs font-semibold text-gray-400 uppercase mb-1.5">САМОЧУВСТВИЕ</div>
          <div class="grid grid-cols-5 gap-1">
            ${feelings.map(f => `
              <button onclick="syncWorkoutInputs(); state.workoutState.feeling='${f}'; render();" class="py-2 rounded-lg text-[11px] font-medium border transition ${ws.feeling === f ? 'border-[#4a156b] bg-purple-50 brand-purple-text font-bold' : 'border-gray-200 text-gray-600 bg-white'}">
                ${f}
              </button>
            `).join('')}
          </div>
        </div>

        <div>
          <label class="text-xs text-gray-500 block mb-1">Комментарий</label>
          <input id="wo-comment" type="text" value="${ws.comment}" placeholder="Боль в плече, тянет поясницу..." class="input-field">
        </div>
      </div>

      <button onclick="recordWorkoutStep('done')" class="w-full brand-purple text-white font-semibold py-3.5 rounded-xl flex items-center justify-center gap-2">
        <span>✔</span> <span>Сделал — следующее</span>
      </button>

      <button onclick="syncWorkoutInputs(); state.modal='confirmSkipExercise'; render();" class="w-full text-center text-xs brand-purple-text font-medium py-2">
        Не смог выполнить
      </button>
    </div>
  `;
}

function renderScheduleList() {
  if (!db.slots || db.slots.length === 0) {
    return `<div class="card p-6 text-center text-xs text-gray-400">Слоты не созданы</div>`;
  }
  return `
    <div class="space-y-4">
      ${db.slots.map(day => `
        <div>
          <div class="text-xs font-semibold text-gray-400 uppercase mb-2">${day.dayLabel}</div>
          <div class="card divide-y divide-gray-100">
            ${day.hours.map(h => `
              <div class="p-3.5 flex justify-between items-center">
                <span class="font-semibold text-sm">${h.time}</span>
                <div class="flex items-center gap-2">
                  <span class="text-xs text-gray-400">${h.bookedPatientIds.length}/${h.capacity}</span>
                  <span class="text-[11px] bg-green-50 text-green-600 font-medium px-2 py-0.5 rounded-md">Свободно</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderProfileScreen(roleSubtitle, showPhone, assignedDoc = null) {
  const u = state.currentUser;
  return `
    <div class="p-4 pt-6 space-y-4">
      <div>
        <h1 class="text-2xl font-bold">Профиль</h1>
        <p class="text-xs text-gray-500">${u.email}</p>
      </div>

      <div class="card p-4 space-y-3">
        <div class="text-xs text-gray-400 font-medium">${roleSubtitle}</div>
        <div>
          <label class="text-xs text-gray-600 block mb-1">Имя</label>
          <input id="prof-name" type="text" value="${u.name || ''}" class="input-field">
        </div>
        ${showPhone ? `
          <div>
            <label class="text-xs text-gray-600 block mb-1">Телефон</label>
            <input id="prof-phone" type="tel" value="${u.phone || ''}" placeholder="+7 ..." class="input-field">
          </div>
        ` : ''}
        <button onclick="saveProfileChanges()" class="w-full brand-purple text-white font-semibold py-3 rounded-xl">
          Сохранить в Supabase
        </button>
      </div>

      ${assignedDoc ? `
        <div class="card p-4">
          <div class="text-[11px] font-semibold text-gray-400 uppercase">ВАШ ВРАЧ</div>
          <div class="font-bold text-sm mt-0.5">${assignedDoc.name}</div>
          <div class="text-xs text-gray-500">${assignedDoc.email}</div>
        </div>
      ` : ''}

      <button onclick="state.modal='confirmLogout'; render();" class="card w-full p-4 text-red-500 font-semibold text-sm flex items-center justify-center gap-2">
        <span>↪</span> <span>Выйти из аккаунта</span>
      </button>
    </div>
  `;
}

function renderBottomNav(role) {
  let tabs = [];
  if (role === 'admin') {
    tabs = [
      { id: 'home', label: 'Главная', icon: ICONS.home },
      { id: 'doctors', label: 'Врачи', icon: ICONS.medkit },
      { id: 'patients', label: 'Пациенты', icon: ICONS.users },
      { id: 'schedule', label: 'Расписание', icon: ICONS.calendar },
      { id: 'profile', label: 'Профиль', icon: ICONS.gear }
    ];
  } else if (role === 'doctor') {
    tabs = [
      { id: 'patients', label: 'Пациенты', icon: ICONS.users },
      { id: 'exercises', label: 'Упражнения', icon: ICONS.dumbbell },
      { id: 'schedule', label: 'Расписание', icon: ICONS.calendar },
      { id: 'profile', label: 'Профиль', icon: ICONS.user }
    ];
  } else {
    tabs = [
      { id: 'home', label: 'Главная', icon: ICONS.home },
      { id: 'exercises', label: 'Упражнен...', icon: ICONS.dumbbell },
      { id: 'schedule', label: 'Расписание', icon: ICONS.calendar },
      { id: 'history', label: 'История', icon: ICONS.chart },
      { id: 'profile', label: 'Профиль', icon: ICONS.user }
    ];
  }

  return `
    <nav class="bottom-nav">
      ${tabs.map(t => {
        const active = state.activeTab === t.id && !state.subScreen;
        return `
          <button onclick="state.subScreen=null; state.activeTab='${t.id}'; render();" class="flex flex-col items-center justify-center flex-1 ${active ? 'brand-purple-text font-semibold' : 'text-gray-400'}">
            ${t.icon}
            <span class="text-[10px] mt-1">${t.label}</span>
          </button>
        `;
      }).join('')}
    </nav>
  `;
}

function renderModal() {
  if (!state.modal) return '';

  if (state.modal === 'configSupabase') {
    return `
      <div class="modal-backdrop" onclick="if(event.target===this){state.modal=null;render();}">
        <div class="modal-sheet space-y-4">
          <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold">Подключение к Supabase</h2>
            <button onclick="state.modal=null; render();" class="text-gray-400 text-lg">✕</button>
          </div>
          <div class="card p-4 space-y-3">
            <div>
              <label class="text-xs text-gray-600 block mb-1">Project URL</label>
              <input id="config-sb-url" type="text" value="${SUPABASE_URL}" placeholder="https://xyz.supabase.co" class="input-field font-mono text-xs">
            </div>
            <div>
              <label class="text-xs text-gray-600 block mb-1">Anon / Public API Key</label>
              <input id="config-sb-key" type="password" value="${SUPABASE_ANON_KEY}" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." class="input-field font-mono text-xs">
            </div>
            <button onclick="saveSupabaseConfig()" class="w-full brand-purple text-white font-semibold py-3.5 rounded-xl">
              Сохранить и подключиться
            </button>
          </div>
          <p class="text-[11px] text-gray-400 leading-relaxed px-1">
            Параметры берутся в панели Supabase: <b>Settings → API</b>. Ключи сохраняются локально в вашем браузере.
          </p>
        </div>
      </div>
    `;
  }

  if (state.modal === 'addDoctor') {
    return `
      <div class="modal-backdrop" onclick="if(event.target===this){state.modal=null;render();}">
        <div class="modal-sheet space-y-4">
          <button onclick="state.modal=null; render();" class="text-sm brand-purple-text font-medium">‹ Назад</button>
          <h2 class="text-xl font-bold">Добавить Врача</h2>
          <div class="card p-4 space-y-3">
            <div>
              <label class="text-xs text-gray-600 block mb-1">E-mail Врача</label>
              <input id="modal-doc-email" type="email" placeholder="doctor@example.com" class="input-field">
            </div>
            <div>
              <label class="text-xs text-gray-600 block mb-1">ФИО (необязательно)</label>
              <input id="modal-doc-name" type="text" placeholder="Иванов И.И." class="input-field">
            </div>
            <button onclick="adminAddDoctor()" class="w-full brand-purple text-white font-semibold py-3.5 rounded-xl">
              Добавить в базу
            </button>
          </div>
        </div>
      </div>
    `;
  }

  if (state.modal === 'addPayment') {
    return `
      <div class="modal-backdrop" onclick="if(event.target===this){state.modal=null;render();}">
        <div class="modal-sheet space-y-4">
          <button onclick="state.modal=null; render();" class="text-sm brand-purple-text font-medium">‹ Назад</button>
          <h2 class="text-xl font-bold">Добавить оплату</h2>
          <div class="card p-4 space-y-3">
            <div>
              <label class="text-xs text-gray-600 block mb-1">Количество занятий</label>
              <input id="pay-lessons" type="number" value="12" class="input-field">
            </div>
            <div>
              <label class="text-xs text-gray-600 block mb-1">Сумма (₽, необязательно)</label>
              <input id="pay-amount" type="number" placeholder="1000" class="input-field">
            </div>
            <div>
              <label class="text-xs text-gray-600 block mb-1">Примечание</label>
              <input id="pay-note" type="text" placeholder="Например: оплата на месяц" class="input-field">
            </div>
            <button onclick="adminAddPayment()" class="w-full brand-purple text-white font-semibold py-3.5 rounded-xl">
              Сохранить оплату
            </button>
          </div>
        </div>
      </div>
    `;
  }

  if (state.modal === 'bookSlot') {
    const hasSlots = db.slots && db.slots.length > 0;
    return `
      <div class="modal-backdrop" onclick="if(event.target===this){state.modal=null;render();}">
        <div class="modal-sheet space-y-4">
          <button onclick="state.modal=null; render();" class="text-sm brand-purple-text font-medium">‹ Назад</button>
          <h2 class="text-xl font-bold">Выберите время</h2>
          ${!hasSlots ? `
            <div class="card p-6 text-center text-xs text-gray-500">
              Администратор ещё не сформировал слоты в расписании.
            </div>
          ` : `
            <div class="space-y-3 max-h-80 overflow-y-auto">
              ${db.slots.slice(0, 3).map(day => `
                <div>
                  <div class="text-xs font-bold text-gray-400 mb-1.5">${day.dayLabel}</div>
                  <div class="grid grid-cols-3 gap-2">
                    ${day.hours.map(h => `
                      <button onclick="patientBookSlot('${day.dayLabel}', '${h.time}')" class="card py-2.5 text-xs font-semibold hover:border-[#4a156b]">
                        ${h.time}
                      </button>
                    `).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      </div>
    `;
  }

  if (state.modal === 'confirmLogout') {
    return `
      <div class="modal-backdrop items-center">
        <div class="dialog-box space-y-3">
          <div class="font-bold text-base">Выйти?</div>
          <p class="text-xs text-gray-500">Вы сможете войти снова по e-mail.</p>
          <div class="grid grid-cols-2 gap-2 pt-2">
            <button onclick="state.modal=null; render();" class="py-2.5 rounded-xl bg-gray-200 font-semibold text-sm">
              Отмена
            </button>
            <button onclick="state.currentUser=null; state.authStep='email'; state.modal=null; render();" class="py-2.5 rounded-xl bg-red-100 text-red-600 font-semibold text-sm">
              Выйти
            </button>
          </div>
        </div>
      </div>
    `;
  }

  if (state.modal === 'confirmSkipExercise') {
    return `
      <div class="modal-backdrop items-center">
        <div class="dialog-box space-y-3">
          <div class="font-bold text-base">Пропустить?</div>
          <p class="text-xs text-gray-500">Упражнение будет помечено как невыполненное.</p>
          <div class="grid grid-cols-2 gap-2 pt-2">
            <button onclick="state.modal=null; render();" class="py-2.5 rounded-xl bg-gray-200 font-semibold text-sm">
              Отмена
            </button>
            <button onclick="recordWorkoutStep('skipped')" class="py-2.5 rounded-xl bg-red-100 text-red-600 font-semibold text-sm">
              Пропустить
            </button>
          </div>
        </div>
      </div>
    `;
  }

  if (state.modal === 'workoutFinished') {
    return `
      <div class="modal-backdrop items-center">
        <div class="dialog-box space-y-3">
          <div class="font-bold text-base">Тренировка завершена</div>
          <p class="text-xs text-gray-500">Все упражнения записаны в Supabase</p>
          <button onclick="state.modal=null; state.subScreen=null; state.activeTab='history'; render();" class="w-full py-2.5 rounded-xl bg-gray-200 font-semibold text-sm mt-2">
            ОК
          </button>
        </div>
      </div>
    `;
  }

  return '';
}

// Первоначальная загрузка
if (supabase) {
  fetchCloudData();
  initRealtimeSubscription();
} else {
  render();
}
</script>
</body>
</html>
